<style>
/* PLAYMAX Admin — the owner's control room. Light brand look, Arabic RTL, big touch targets. */
:root{
  --ink:#0B2A6F; --ink-2:#3A4C7A; --muted:#5A6A92; --cream:#FFF8EE; --paper:#fff;
  --line:rgba(11,42,111,.10); --line-2:rgba(11,42,111,.18);
  --blue:#1F5BD8; --blue-d:#1543A8; --sky:#22B0F0; --red:#E8352B; --red-d:#B5221A; --gold:#FFC233; --gold-d:#D99A00; --green:#1E9E52; --green-d:#147A3D;
  --tint-sky:#E4F4FE; --tint-gold:#FFF3D6; --tint-pink:#FFE8F0; --tint-green:#E3F7EA;
  --font:'Vazirmatn',system-ui,sans-serif; --display:'Unbounded','Vazirmatn',system-ui,sans-serif;
  --shadow:0 14px 34px -18px rgba(11,42,111,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;line-height:1.2;font-weight:900}
p{margin:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
.num,[dir=ltr]{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,238,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{height:40px;width:40px;border-radius:50%}
.top .tt{flex:1;min-width:0}
.top h1{font-size:19px}
.top small{display:block;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:18px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{--b:var(--blue);--bd:var(--blue-d);--fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:0;border-radius:15px;background:var(--b);color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 var(--bd);text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn.gold{--b:var(--gold);--bd:var(--gold-d);--fg:var(--ink)}
.btn.red{--b:var(--red);--bd:var(--red-d)}
.btn.green{--b:var(--green);--bd:var(--green-d)}
.btn.ghost{--b:#fff;--bd:var(--line-2);--fg:var(--ink);outline:1.5px solid var(--line-2);outline-offset:-1.5px}
.btn.sm{min-height:40px;padding:0 13px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
label.f small{font-weight:600;color:var(--muted);font-size:12px}
.in{width:100%;min-height:48px;border-radius:13px;border:1.5px solid var(--line-2);background:#fff;padding:10px 13px;font-weight:600;font-size:15px}
textarea.in{min-height:92px;resize:vertical;line-height:1.5}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(31,91,216,.15)}
.in[dir=ltr]{text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}@media (min-width:600px),(hover:hover) and (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;font-weight:800;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:var(--tint-sky);color:var(--blue)}
.pill.warn{background:var(--tint-gold);color:#8A5A00}.pill.ok{background:var(--tint-green);color:#11683A}.pill.bad{background:#FFE3E1;color:var(--red-d)}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar .in2{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:800;color:var(--muted);cursor:pointer;border-radius:12px;position:relative}
.tabbar button[aria-current=true]{color:var(--blue);background:var(--tint-sky)}
.tabbar .dot{position:absolute;top:4px;inset-inline-end:22%;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;line-height:18px;padding:0 4px}
.hero{background:linear-gradient(155deg,#12347F,#0B2A6F 60%,#081D4E);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-30%;top:-40%;width:80%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,194,51,.35),transparent);pointer-events:none}
.hero h2{font-size:22px;color:var(--gold)}
.hero p{opacity:.9;font-weight:600;margin-top:4px}
.hero .btn{margin-top:14px;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:18px;padding:12px;border:1px solid var(--line);text-align:center}
.stat b{display:block;font:900 22px var(--display)}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-weight:800;box-shadow:var(--shadow)}
.quick button span{font-size:24px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;border:1px solid var(--line)}
.prow.off{opacity:.55}
.prow .th{width:64px;height:64px;border-radius:14px;background:var(--tint-sky);display:grid;place-items:center;overflow:hidden;cursor:pointer;border:0;padding:4px}
.prow .th img{max-height:100%;width:auto;object-fit:contain}
.prow .nm{min-width:0;cursor:pointer;background:none;border:0;text-align:start;padding:0}
.prow .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.prow .pr{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.price-in{width:104px;min-height:40px;border-radius:11px;border:1.5px solid var(--line-2);padding:0 10px;font-weight:900;font-size:15px;text-align:left;direction:ltr}
.price-in.changed{border-color:var(--gold-d);background:var(--tint-gold)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:#C9D2E6;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(-20px)}
[dir=ltr] .sw input:checked+i::after{transform:translateX(20px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;background:var(--tint-sky);overflow:hidden;border:2px solid transparent;display:grid;place-items:center}
.ph.main{border-color:var(--gold)}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .x{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(11,42,111,.85);color:#fff;font-weight:900;cursor:pointer;line-height:1}
.ph .mk{position:absolute;bottom:6px;inset-inline-start:6px;border:0;border-radius:999px;background:#fff;font-size:11px;font-weight:800;padding:3px 8px;cursor:pointer}
.ph .mk.on{background:var(--gold)}
.addph{aspect-ratio:1;border-radius:16px;border:2px dashed var(--line-2);display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px;color:var(--blue);cursor:pointer;background:#fff;position:relative}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--tint-sky);border-radius:14px;padding:4px}
.ltabs button{border:0;border-radius:10px;min-height:38px;background:none;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.ltabs button[aria-pressed=true]{background:#fff;box-shadow:0 2px 8px rgba(11,42,111,.12)}
.ltabs button .fl{width:20px;height:14px;border-radius:3px;overflow:hidden;display:inline-block}
.ltabs button .fl svg{width:100%;height:100%;display:block}
.ltabs button.filled::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.newsrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;border:1px solid var(--line)}
.newsrow .th{width:72px;height:56px;border-radius:12px;background:var(--tint-gold);overflow:hidden;display:grid;place-items:center;font-size:24px}
.newsrow .th img{width:100%;height:100%;object-fit:cover}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;align-items:center}
.del{width:44px;height:44px;border-radius:12px;border:1.5px solid #FFC9C4;background:#FFF3F2;color:var(--red-d);font-weight:900;cursor:pointer;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(8,29,78,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:26px}}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.steps li i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--tint-sky);color:var(--blue)}
.steps li.done i{background:var(--green);color:#fff}
.steps li.run i{background:var(--gold);color:var(--ink);animation:pulse 1s infinite}
.steps li.err i{background:var(--red);color:#fff}
@keyframes pulse{50%{transform:scale(1.15)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(200%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;z-index:80;transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%)}
.guide{counter-reset:g;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.guide li{counter-increment:g;display:grid;grid-template-columns:30px 1fr;gap:10px;font-weight:600;font-size:14px}
.guide li::before{content:counter(g);width:30px;height:30px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-weight:900}
.guide b{font-weight:800}
code{background:var(--tint-sky);padding:1px 6px;border-radius:6px;font-size:13px;direction:ltr;display:inline-block}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.lock img{width:96px;border-radius:50%}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
.pinpad button{height:64px;border-radius:18px;border:1.5px solid var(--line-2);background:#fff;font:900 22px var(--display);cursor:pointer}
.pindots{display:flex;gap:12px;direction:ltr}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-weight:700}
.empty span{font-size:40px;display:block}
.search{position:relative}
.search .in{padding-inline-start:42px}
.search svg{position:absolute;top:50%;inset-inline-start:14px;transform:translateY(-50%);color:var(--muted)}
.links .btn{height:auto;min-height:44px;padding:8px 12px;flex-wrap:wrap;word-break:break-all;text-align:center;line-height:1.35}
.diff{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;background:var(--tint-sky);border-radius:14px;padding:10px 12px}
.bktypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.bktypes button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-weight:800;font-size:12px;cursor:pointer;text-align:center}.bktypes button span{font-size:22px}.bktypes button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.bkthemes{display:flex;flex-wrap:wrap;gap:10px}.bkthemes button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer}.bkthemes button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}.bkprevcard{display:flex;flex-direction:column;gap:10px}.bkframe{background:#FFF8EC;border-radius:18px;overflow:hidden;border:1px dashed var(--line-2)}.bkframe.phone{max-width:360px;margin-inline:auto}.hrow.hid{opacity:.55}.ib[disabled]{opacity:.3;cursor:default}
</style>
</head>

<script>
'use strict';
/* =========================================================================
   PLAYMAX Admin
   Publishes content.json (+ uploaded photos) into the website and app
   GitHub repositories. GitHub Pages serves them within about a minute and
   both the website and the app load content.json on every start.
   ========================================================================= */
const PM=window.PM; const {CATS,PRODUCTS,RATES,CONTACT,FLAG,esc,money}=PM;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
try{document.head.insertAdjacentHTML('beforeend','<style>'+PM.GUIDE_CSS+PM.BLOCK_CSS+PM.BLOCK_APP_CSS+'</style>');}catch(e){}
const LS={get(k,d){try{const v=localStorage.getItem('pmxadmin:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('pmxadmin:'+k,JSON.stringify(v));return true;}catch(e){return false;}},del(k){try{localStorage.removeItem('pmxadmin:'+k);}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const LANGS=[['en','English','EN'],['fa','دری','AF'],['uz','O‘zbek','UZ'],['ru','Русский','RU']];

function defaults(){return {version:1,updated:null,products:{},added:[],rates:RATES.map(r=>({country:r.country,rate:r.rate})),install:50,contact:{...BASE_CONTACT},news:[],promos:clone(BASE_PROMOS),hero:{title:{},text:{}},firebase:{apiKey:'',projectId:''},blockedWords:[],pages:[],guides:[],home:{order:[],hidden:[],blocks:[]}};}
function normalize(c){const d=defaults(); c=c&&typeof c==='object'?c:{}; return {version:1,updated:c.updated||null,products:c.products&&typeof c.products==='object'?c.products:{},added:Array.isArray(c.added)?c.added:[],rates:Array.isArray(c.rates)&&c.rates.length?c.rates:d.rates,install:c.install==null?50:+c.install,contact:{...d.contact,...(c.contact||{})},news:Array.isArray(c.news)?c.news:[],promos:Array.isArray(c.promos)?c.promos:clone(BASE_PROMOS),hero:{title:(c.hero&&c.hero.title)||{},text:(c.hero&&c.hero.text)||{}},firebase:{apiKey:(c.firebase&&c.firebase.apiKey)||'',projectId:(c.firebase&&c.firebase.projectId)||''},blockedWords:Array.isArray(c.blockedWords)?c.blockedWords:[],pages:Array.isArray(c.pages)?c.pages:[],guides:Array.isArray(c.guides)?c.guides:[],home:{order:Array.isArray(c.home&&c.home.order)?c.home.order:[],hidden:Array.isArray(c.home&&c.home.hidden)?c.home.hidden:[],blocks:Array.isArray(c.home&&c.home.blocks)?c.home.blocks:[]}};}

function persist(){const ok=LS.set('draft',A.draft)&&LS.set('pending',A.pending); if(!ok) toast('⚠️ ذاكرة الجهاز ممتلئة — انشر التغييرات الآن حتى لا تضيع الصور'); }

function changesCount(){const base=normalize(A.remote||defaults()); const d=A.draft; let n=0;
  const ids=new Set([...Object.keys(base.products),...Object.keys(d.products)]); ids.forEach(id=>{if(JSON.stringify(base.products[id]||null)!==JSON.stringify(d.products[id]||null)) n++;});
  const ai=new Set([...base.added.map(a=>a.id),...d.added.map(a=>a.id)]); ai.forEach(id=>{if(JSON.stringify(base.added.find(a=>a.id===id)||null)!==JSON.stringify(d.added.find(a=>a.id===id)||null)) n++;});
  const ni=new Set([...base.news.map(a=>a.id),...d.news.map(a=>a.id)]); ni.forEach(id=>{if(JSON.stringify(base.news.find(a=>a.id===id)||null)!==JSON.stringify(d.news.find(a=>a.id===id)||null)) n++;});
  if(JSON.stringify(base.news.map(x=>x.id))!==JSON.stringify(d.news.map(x=>x.id))&&n===0) n++;
  if(JSON.stringify(base.rates)!==JSON.stringify(d.rates)) n++;
  if(+base.install!==+d.install) n++;
  if(JSON.stringify(base.contact)!==JSON.stringify(d.contact)) n++;
  ['promos','hero','firebase','blockedWords','pages','guides','home'].forEach(k=>{if(JSON.stringify(base[k])!==JSON.stringify(d[k])) n++;});
  return n;}

function rawUrl(path){const repo=A.cfg.webRepo||A.cfg.appRepo; const br=(A.cfg.branches||{})[repo]||'main'; return 'https://raw.githubusercontent.com/'+encodeURIComponent(A.cfg.owner)+'/'+encodeURIComponent(repo)+'/'+encodeURIComponent(br)+'/'+path.split('/').map(encodeURIComponent).join('/');}
function imgUrl(path){if(!path) return ''; if(A.pending[path]) return A.pending[path]; if(/^(https:|data:image)/.test(path)) return path; if(path.startsWith('assets/u/')) return rawUrl(path); return path;}
function allProducts(){
  const d=A.draft;
  const base=PRODUCTS.map(p=>{const o=d.products[p.id]||{}; const gal=Array.isArray(o.gallery)?o.gallery:[]; return {id:p.id,builtin:true,model:o.model||p.model,name:o.name||p.name,names:o.names||{},cat:p.cat,price:o.price>0?+o.price:p.price,basePrice:p.price,specs:o.specs&&o.specs.length?o.specs:p.specs,desc:o.desc||{},hidden:!!o.hidden,isNew:o.isNew!=null?!!o.isNew:!!p.isNew,deleted:!!o.deleted,img:o.img||(gal[0]||p.img),gallery:gal,origImg:p.img,changed:!!d.products[p.id]};});
  const added=d.added.map(a=>({...a,builtin:false,names:a.names||{},desc:a.desc||{},specs:a.specs||[],gallery:a.gallery||[],hidden:!!a.hidden,isNew:a.isNew!==false,changed:true}));
  return base.concat(added);}
function getProduct(id){return allProducts().find(p=>String(p.id)===String(id));}
function setOverride(id,patch){const p=PRODUCTS.find(x=>x.id===+id); const o={...(A.draft.products[id]||{}),...patch};
  if(p){ if(o.price!=null&&+o.price===p.price) delete o.price; if(o.hidden===false) delete o.hidden; if(o.deleted===false) delete o.deleted; if(o.isNew!=null&&!!o.isNew===!!p.isNew) delete o.isNew; if(o.model===p.model) delete o.model; if(o.name===p.name) delete o.name;
    if(o.specs&&JSON.stringify(o.specs)===JSON.stringify(p.specs)) delete o.specs; ['names','desc'].forEach(k=>{if(o[k]&&!Object.values(o[k]).some(Boolean)) delete o[k];}); if(o.gallery&&!o.gallery.length) delete o.gallery; if(!o.img) delete o.img; }
  Object.keys(o).forEach(k=>{if(o[k]===undefined) delete o[k];});
  if(Object.keys(o).length) A.draft.products[id]=o; else delete A.draft.products[id];
  persist();}
const nextId=()=>Math.max(1000,...A.draft.added.map(a=>+a.id||0))+1;

/* ---------------- images ---------------- */
function readImage(file,max=1400,q=.85){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type)) return rej(new Error('type'));const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.src=r.result;};r.readAsDataURL(file);});}
async function addFiles(files){const out=[];for(const f of [...files].slice(0,10)){try{const data=await readImage(f);const path='assets/u/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.jpg';A.pending[path]=data;out.push(path);}catch(e){toast('تعذّر قراءة صورة: '+(f.name||''));}}persist();return out;}

/* ---------------- GitHub ---------------- */
const b64utf8=s=>{const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);};
const unb64utf8=b=>new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+A.cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})},body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'});
  if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch(e){} const err=new Error(r.status+(m?' — '+m:''));err.status=r.status;throw err;}
  return r.status===204?null:r.json();}
const repoPath=repo=>'/repos/'+encodeURIComponent(A.cfg.owner)+'/'+encodeURIComponent(repo);
async function branchOf(repo){A.cfg.branches=A.cfg.branches||{}; if(A.cfg.branches[repo]) return A.cfg.branches[repo]; const info=await gh(repoPath(repo)); A.cfg.branches[repo]=info.default_branch||'main'; LS.set('cfg',A.cfg); return A.cfg.branches[repo];}
async function fetchRemote(){const repo=A.cfg.webRepo||A.cfg.appRepo; const br=await branchOf(repo);
  try{const j=await gh(repoPath(repo)+'/contents/content.json?ref='+encodeURIComponent(br)); return JSON.parse(unb64utf8(j.content));}catch(e){if(e.status===404) return null; throw e;}}
async function commitFiles(repo,files,message,onStep){
  const br=await branchOf(repo);
  const ref=await gh(repoPath(repo)+'/git/ref/heads/'+encodeURIComponent(br)); const head=ref.object.sha;
  const commit=await gh(repoPath(repo)+'/git/commits/'+head);
  const tree=[]; let i=0;
  for(const f of files){i++; onStep&&onStep(i,files.length); const blob=await gh(repoPath(repo)+'/git/blobs',{method:'POST',body:{content:f.base64,encoding:'base64'}}); tree.push({path:f.path,mode:'100644',type:'blob',sha:blob.sha});}
  const t=await gh(repoPath(repo)+'/git/trees',{method:'POST',body:{base_tree:commit.tree.sha,tree}});
  const c=await gh(repoPath(repo)+'/git/commits',{method:'POST',body:{message,tree:t.sha,parents:[head]}});
  await gh(repoPath(repo)+'/git/refs/heads/'+encodeURIComponent(br),{method:'PATCH',body:{sha:c.sha}});
  return c.sha;}
function pagesUrl(repo){if(!repo||!A.cfg.owner) return ''; const o=A.cfg.owner.toLowerCase(); return repo.toLowerCase()===o+'.github.io'?'https://'+o+'.github.io/':'https://'+o+'.github.io/'+repo+'/';}
const siteUrl=()=>A.cfg.webUrl||pagesUrl(A.cfg.webRepo);
const appUrl=()=>A.cfg.appUrl||pagesUrl(A.cfg.appRepo);

/* ---------------- publish ---------------- */
function usedPaths(c){const s=JSON.stringify(c); return Object.keys(A.pending).filter(p=>s.includes('"'+p+'"'));}
async function publish(){
  if(!connected()){toast('اربط حساب GitHub أولاً من الإعدادات');A.tab='settings';render();return;}
  const repos=[A.cfg.webRepo,A.cfg.appRepo].filter(Boolean).filter((r,i,a)=>a.indexOf(r)===i);
  const content=normalize(clone(A.draft)); content.updated=new Date().toISOString();
  const imgs=usedPaths(content);
  const files=[{path:'content.json',base64:b64utf8(JSON.stringify(content,null,1))}].concat(imgs.map(p=>({path:p,base64:A.pending[p].split(',')[1]})));
  const steps=repos.map(r=>({repo:r,label:(r===A.cfg.webRepo?'الموقع':'التطبيق')+' ('+r+')',st:''}));
  const draw=(msg)=>{$('#layer').innerHTML='<div class="sheet"><div class="box" role="dialog" aria-label="نشر"><h2 style="font-size:20px">جاري النشر…</h2><p class="muted" style="font-weight:700">'+files.length+' ملف · '+imgs.length+' صورة جديدة</p><ul class="steps">'+steps.map(s=>'<li class="'+s.st+'"><i>'+(s.st==='done'?'✓':s.st==='err'?'!':'•')+'</i>'+esc(s.label)+(s.note?' <span class="muted">'+esc(s.note)+'</span>':'')+'</li>').join('')+'</ul>'+(msg||'')+'</div></div>';};
  draw();
  try{
    for(const s of steps){s.st='run';draw(); await commitFiles(s.repo,files,'PLAYMAX Admin: update content',(i,n)=>{s.note=i+'/'+n;draw();}); s.st='done'; s.note=''; draw();}
    A.remote=content; A.draft=clone(content); const keep={}; A.pending=keep; A.lastPublish=content.updated;
    LS.set('remote',A.remote); LS.set('lastPublish',A.lastPublish); persist();
    draw('<div class="card" style="background:var(--tint-green);box-shadow:none;border:0"><b>تم النشر بنجاح ✓</b><p style="font-weight:600;margin-top:4px">ستظهر التغييرات في الموقع والتطبيق خلال دقيقة تقريباً. التطبيق يحدّث نفسه تلقائياً عند فتحه.</p></div><div class="grid2">'+(siteUrl()?'<a class="btn ghost sm" href="'+esc(siteUrl())+'" target="_blank" rel="noopener">فتح الموقع '+IC.ext+'</a>':'')+(appUrl()?'<a class="btn ghost sm" href="'+esc(appUrl())+'" target="_blank" rel="noopener">فتح التطبيق '+IC.ext+'</a>':'')+'</div><button class="btn block" data-act="closeLayer">تم</button>');
  }catch(e){const cur=steps.find(s=>s.st==='run'); if(cur) cur.st='err';
    draw('<div class="card" style="background:#FFF3F2;box-shadow:none;border:0"><b>لم يكتمل النشر</b><p style="font-weight:600;margin-top:4px">'+esc(explainError(e))+'</p><p class="muted" style="font-size:13px;margin-top:6px">تغييراتك محفوظة على هذا الجهاز، جرّب مرة أخرى.</p></div><div class="grid2"><button class="btn gold" data-act="publish">إعادة المحاولة</button><button class="btn ghost" data-act="closeLayer">إغلاق</button></div>');}
  render();}
function explainError(e){const s=e&&e.status; if(s===401) return 'الرمز (Token) غير صحيح أو انتهت صلاحيته. أنشئ رمزاً جديداً من GitHub.'; if(s===403) return 'الرمز لا يملك صلاحية الكتابة. فعّل Contents: Read and write للمستودعين.'; if(s===404) return 'لم يتم العثور على المستودع أو الفرع. تأكد من اسم الحساب وأسماء المستودعات، وأن الرمز يشملها.'; if(s===409||s===422) return 'حدث تعارض في المستودع (ربما المستودع فارغ أو تغيّر للتو). جرّب مرة أخرى بعد قليل.'; if(!navigator.onLine) return 'لا يوجد اتصال بالإنترنت.'; return 'خطأ: '+(e&&e.message||e);}

const MKA={auth:null,db:null,posts:[],bans:{},reports:[],loading:false,loaded:0,err:'',photos:{}};
const fbCfg=()=>A.draft.firebase&&A.draft.firebase.apiKey&&A.draft.firebase.projectId?A.draft.firebase:null;
function mkAdminConn(){const c=fbCfg(); if(!c) return null; if(!MKA.db||MKA.key!==c.apiKey+c.projectId){MKA.auth=PM.firebaseAuth(c,'admin'); MKA.db=PM.firestoreDb(c,MKA.auth,{noAnon:true,pollMs:600000}); MKA.key=c.apiKey+c.projectId; MKA.loaded=0;} return MKA.db;}
function rulesText(email){return "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function isOwner() { return request.auth != null && request.auth.token.email == '"+(email||'OWNER@EMAIL')+"'; }\n    function isBanned() { return exists(/databases/$(database)/documents/mod/bans) && (request.auth.uid in get(/databases/$(database)/documents/mod/bans).data.users); }\n    function canWrite(uid) { return isOwner() || (request.auth != null && request.auth.uid == uid && !isBanned()); }\n    match /posts/{uid} {\n      allow read: if true;\n      allow write: if canWrite(uid);\n      match /ph/{pid} { allow read: if true; allow write: if canWrite(uid); }\n    }\n    match /mod/{doc} { allow read: if true; allow write: if isOwner(); }\n    match /reports/{uid} { allow read: if isOwner(); allow write: if isOwner() || (request.auth != null && request.auth.uid == uid); }\n  }\n}";}
async function mkAdminLoad(force){const db=mkAdminConn(); if(!db||!MKA.auth.signedIn()||MKA.loading) return; if(!force&&Date.now()-MKA.loaded<20000) return;
  MKA.loading=true; MKA.err='';
  try{const [posts,bans,reps]=await Promise.all([db.collection('posts').list(),db.doc('mod/bans').get(),db.collection('reports').list()]);
    MKA.posts=[]; posts.forEach(d=>((d.data()||{}).items||[]).forEach(it=>MKA.posts.push({...it,author:d.id}))); MKA.posts.sort((a,b)=>(b.at||0)-(a.at||0));
    MKA.bans=(bans.exists&&(bans.data()||{}).users)||{}; MKA.reports=[]; reps.forEach(d=>((d.data()||{}).items||[]).forEach(r=>MKA.reports.push({...r,reporter:d.id}))); MKA.reports.sort((a,b)=>(b.at||0)-(a.at||0));
    MKA.loaded=Date.now();
  }catch(e){MKA.err=e&&e.message||'error';}
  MKA.loading=false; if(A.tab==='market'&&!A.page){const y=window.scrollY; render(); window.scrollTo(0,y);} }
async function mkAdminPhoto(author,pid){const k=author+'/'+pid; if(MKA.photos[k]!==undefined) return; MKA.photos[k]=''; try{const s=await MKA.db.doc('posts/'+author+'/ph/'+pid).get(); MKA.photos[k]=(s.exists&&(s.data()||{}).data)||'';}catch(e){} $$('img[data-mkp="'+k+'"]').forEach(i=>{if(MKA.photos[k]) i.src=MKA.photos[k];});}
async function mkAdminDismiss(reporter,id){const ref=MKA.db.doc('reports/'+reporter); const snap=await ref.get(); const items=((snap.exists&&snap.data().items)||[]).filter(x=>x.id!==id); await ref.set({items,updatedAt:Date.now()});}
async function mkAdminEditItems(author,fn){const ref=MKA.db.doc('posts/'+author); const snap=await ref.get(); const items=((snap.exists&&snap.data().items)||[]).slice(); const out=fn(items); await ref.set({items:out.items,updatedAt:Date.now()}); (out.dropPhotos||[]).forEach(pid=>MKA.db.doc('posts/'+author+'/ph/'+pid).delete().catch(()=>{}));}

async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pmx:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function pinKey(k){
  if(k==='⌫'){A.pin=A.pin.slice(0,-1); render(); return;}
  if(A.pin.length>=4) return; A.pin+=k; render(); if(A.pin.length<4) return;
  const h=await sha256(A.pin);
  if(A.pinMode==='unlock'){ if(h===LS.get('pinHash')){A.unlocked=true;A.pinMode=null;A.pin='';render();} else {A.pin='';render();toast('رمز غير صحيح');} return;}
  if(A.pinMode==='set'){A.pinFirst=h;A.pin='';A.pinMode='confirm';render();return;}
  if(A.pinMode==='confirm'){ if(h===A.pinFirst){LS.set('pinHash',h);A.unlocked=true;toast('تم تعيين رمز القفل ✓');} else toast('الرمزان غير متطابقين'); A.pin='';A.pinMode=null;render();}}

function updateBadge(){const tb=$('.tabbar'); if(tb) tb.outerHTML=tabbar();}
function collectShip(){const d=A.draft; $$('[data-rc]').forEach(el=>{const i=+el.dataset.rc; if(d.rates[i]) d.rates[i].country=el.value.trim();}); $$('[data-rr]').forEach(el=>{const i=+el.dataset.rr; if(d.rates[i]) d.rates[i].rate=Math.max(0,+el.value||0);});}
document.addEventListener('submit',async e=>{const f=e.target; const kind=f.dataset.form; if(!kind) return; e.preventDefault();
  if(kind==='block'){const e=A.editBK; if(e.busy){toast('استنى لحتى يخلص رفع الفيديو');return;} const rec=readBlock();
    if(rec.ctas.includes('link')&&!/^https:\/\//.test(rec.link)){toast('الرابط يجب أن يبدأ بـ https://');return;}
    if(rec.video&&!/^(https:\/\/|assets\/)/.test(rec.video)){toast('رابط الفيديو لازم يبلّش بـ https://');return;}
    const empty=!Object.keys(rec.title).length&&!Object.keys(rec.text).length&&!rec.img&&!rec.gallery.length&&!rec.video; if(empty){toast('اكتب عنوان أو نص، أو ضيف صورة أو فيديو');return;}
    const H=A.draft.home; if(e.isNew){const o=homeOrder(); const at=o.indexOf('hero'); o.splice(at<0?0:at+1,0,rec.id); H.blocks.push(rec); H.order=o;} else H.blocks=H.blocks.map(x=>x.id===rec.id?rec:x);
    persist(); closePage(); A.tab='content'; A.sub='home'; render(); toast('تم حفظ المربع ✓ — انشر ليظهر'); return;}
  if(kind==='guide'){const e=A.editGD; if(e.busy){toast('استنى لحتى يخلص رفع الفيديو');return;} const title=readLang('gdtitle'); if(!Object.keys(title).length){toast('اكتب عنوان المشكلة');return;}
    const link=$('#gdLink').value.trim(); if(link&&!/^https:\/\//.test(link)){toast('رابط الفيديو لازم يبلّش بـ https://');return;}
    const video=link||e.video||''; const rec={id:e.id,title,text:readLang('gdtext'),steps:readLang('gdsteps'),video,poster:/^assets\//.test(video)?e.poster||'':'',machine:$('#gdMachine').value};
    A.draft.guides=A.draft.guides||[]; if(e.isNew) A.draft.guides.push(rec); else A.draft.guides=A.draft.guides.map(x=>x.id===rec.id?rec:x);
    persist(); closePage(); A.tab='content'; A.sub='guides'; render(); toast('تم حفظ الفيديو ✓ — انشر ليظهر'); return;}
  if(kind==='cpage'){const title=readLang('cptitle'); if(!Object.keys(title).length){toast('اكتب عنوان الصفحة');return;}
    const ctas=$$('[data-cpcta]').filter(c=>c.checked).map(c=>c.dataset.cpcta).slice(0,3), link=$('#cpLink').value.trim(); if(ctas.includes('link')&&!/^https:\/\//.test(link)){toast('الرابط يجب أن يبدأ بـ https://');return;}
    const rec={id:A.editCP.id,title,text:readLang('cptext'),img:A.editCP.img||'',gallery:A.editCP.gallery.slice(0,8),ctas,link,inMenu:$('#cpMenu').checked};
    A.draft.pages=A.draft.pages||[]; if(A.editCP.isNew) A.draft.pages.push(rec); else A.draft.pages=A.draft.pages.map(x=>x.id===rec.id?rec:x);
    persist(); closePage(); A.tab='content'; A.sub='pages'; render(); toast('تم حفظ الصفحة ✓ — انشر لتظهر'); return;}
  if(kind==='hero'){A.draft.hero={title:readLang('htitle'),text:readLang('htext')}; persist(); render(); toast('تم الحفظ ✓ — انشر ليظهر'); return;}
  if(kind==='words'){A.draft.blockedWords=$('#bw').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,300); persist(); render(); toast('تم الحفظ ✓ — انشر ليُطبَّق'); return;}
  if(kind==='promo'){const title=readLang('ptitle'), text=readLang('ptext'), quote=readLang('pquote'); if(!Object.keys(title).length&&!Object.keys(text).length&&!Object.keys(quote).length){toast('اكتب عنواناً أو نصاً');return;}
    const ctas=$$('[data-cta]').filter(c=>c.checked).map(c=>c.dataset.cta).slice(0,3), cta=ctas[0]||'none', link=$('#pLink').value.trim(); if(ctas.includes('link')&&!/^https:\/\//.test(link)){toast('الرابط يجب أن يبدأ بـ https://');return;}
    const rec={id:A.editPromo.id,theme:A.editPromo.theme,icon:$('#pIcon').value.trim().slice(0,4),img:A.editPromo.img||'',title,text,quote,author:$('#pAuthor').value.trim(),cta,ctas,link,button:readLang('pbtn')};
    if(A.editPromo.isNew) A.draft.promos.push(rec); else A.draft.promos=A.draft.promos.map(x=>x.id===rec.id?rec:x);
    persist(); closePage(); A.tab='content'; A.sub='promos'; render(); toast('تم الحفظ ✓ — انشر ليظهر'); return;}
  if(kind==='fb'){const key=$('#fKey').value.trim(), pid=$('#fPid').value.trim().toLowerCase(), mail=$('#fMail').value.trim(); if(!/^[\w-]{20,60}$/.test(key)){toast('apiKey غير صحيح');return;} if(!/^[a-z0-9-]{4,40}$/.test(pid)){toast('projectId غير صحيح');return;}
    A.draft.firebase={apiKey:key,projectId:pid}; A.cfg.fbEmail=mail; LS.set('cfg',A.cfg); persist(); MKA.db=null; render(); toast('تم الحفظ ✓ — انسخ قواعد الحماية ثم سجّل الدخول'); return;}
  if(kind==='fblogin'){const btn=f.querySelector('[type=submit]'); btn.disabled=true; btn.textContent='جاري الدخول…'; try{mkAdminConn(); await MKA.auth.signIn($('#lMail').value.trim(),$('#lPass').value); A.cfg.fbEmail=$('#lMail').value.trim(); LS.set('cfg',A.cfg); MKA.loaded=0; render(); mkAdminLoad(true); toast('تم الدخول ✓');}catch(e){btn.disabled=false; btn.textContent='دخول'; const c=String(e.code||e.message||''); toast(/PASSWORD|CREDENTIAL|EMAIL_NOT_FOUND/.test(c)?'الإيميل أو كلمة السر غير صحيحة':/OPERATION_NOT_ALLOWED/.test(c)?'فعّل Email/Password في Firebase Authentication':'تعذّر الدخول: '+c);} return;}
  if(kind==='mkedit'){const ed=A.mkEdit; const fields={title:$('#meT').value.trim().slice(0,80),price:Math.max(0,Math.round(+$('#meP').value||0)),desc:$('#meD').value.trim().slice(0,1200)}; if(!fields.title){toast('اكتب عنواناً');return;}
    try{await mkAdminEditItems(ed.author,items=>({items:items.map(x=>x.id===ed.id?{...x,...fields,edited:Date.now(),editedBy:'admin'}:x)})); toast('تم حفظ التعديل');}catch(e){toast('لم يتم: '+(e.message||e.code||''));} A.mkEdit=null; mkAdminLoad(true); return;}
  if(kind==='product'){const id=A.page.id, isNew=id==='new'; const model=$('#eModel').value.trim(), name=$('#eName').value.trim(), price=Math.round(+$('#ePrice').value||0);
    if(!model||!name||!price){toast('اكتب الموديل والاسم والسعر');return;}
    const names=readLang('names'); delete names.en; const desc=readLang('desc'); const specs=$('#eSpecs').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12);
    const photos=A.edit.photos, main=A.edit.main||photos[0]||''; const gallery=main?[main,...photos.filter(u=>u!==main)]:[];
    const hidden=!$('#eVis').checked, isNewB=$('#eNew').checked;
    if(isNew||+id>=1000){ if(!main){toast('أضف صورة واحدة على الأقل');return;}
      const rec={id:isNew?nextId():+id,cat:isNew?$('#eCat').value:($('#eCat')?$('#eCat').value:getProduct(id).cat),model,name,names,price,specs,desc,img:main,gallery,hidden,isNew:isNewB};
      if(isNew) A.draft.added.push(rec); else A.draft.added=A.draft.added.map(x=>String(x.id)===String(id)?rec:x);
      persist();
    } else setOverride(id,{model,name,names,price,specs,desc,img:main||undefined,gallery:gallery.length?gallery:undefined,hidden,isNew:isNewB});
    closePage(); A.tab='products'; render(); toast('تم الحفظ ✓ — اضغط «انشر» من الرئيسية'); return;}
  if(kind==='news'){const title=readLang('ntitle'), text=readLang('ntext'); if(!Object.keys(title).length&&!Object.keys(text).length){toast('اكتب عنواناً أو نصاً');return;}
    const link=$('#nLink').value.trim(); if(link&&!/^https:\/\//.test(link)){toast('الرابط يجب أن يبدأ بـ https://');return;}
    const rec={id:A.editNews.id,date:$('#nDate').value.trim(),title,text,img:A.editNews.img||'',link};
    if(A.editNews.isNew) A.draft.news.unshift(rec); else A.draft.news=A.draft.news.map(x=>x.id===rec.id?rec:x);
    persist(); closePage(); A.tab='content'; A.sub='news'; render(); toast('تم حفظ الخبر ✓ — انشر ليظهر'); return;}
  if(kind==='ship'){collectShip(); const d=A.draft; d.rates=d.rates.filter(r=>r.country); if(!d.rates.length){toast('أضف دولة واحدة على الأقل');return;}
    d.install=Math.max(0,+$('#sInst').value||0);
    d.contact={phone:$('#cPhone').value.trim(),whatsapp:$('#cWa').value.trim(),telegram:$('#cTg').value.trim(),email:$('#cMail').value.trim(),instagram:$('#cIg').value.trim(),facebook:$('#cFb').value.trim(),tiktok:$('#cTt').value.trim(),orderBot:$('#cBot').value.trim()};
    if(d.contact.orderBot&&!/^https:\/\/[\w.-]+(\/[\w\-./]*)?$/.test(d.contact.orderBot)){toast('رابط البوت لازم يبلّش بـ https://');return;}
    persist(); render(); toast('تم الحفظ ✓ — انشر ليظهر'); return;}
  if(kind==='gh'){const cfg={...A.cfg,owner:$('#gOwner').value.trim().replace(/^@/,''),token:$('#gToken').value.trim(),webRepo:$('#gWeb').value.trim(),appRepo:$('#gApp').value.trim(),webUrl:$('#gWebUrl').value.trim(),appUrl:$('#gAppUrl').value.trim(),branches:{}};
    if(!cfg.owner||!cfg.token||!(cfg.webRepo||cfg.appRepo)){toast('اكتب اسم الحساب والرمز واسم مستودع واحد على الأقل');return;}
    const btn=f.querySelector('[type=submit]'); btn.disabled=true; btn.textContent='جاري التحقق…';
    const old=A.cfg; A.cfg=cfg;
    try{ for(const r of [cfg.webRepo,cfg.appRepo].filter(Boolean)){const info=await gh(repoPath(r)); if(info.permissions&&info.permissions.push===false) throw Object.assign(new Error('403'),{status:403}); cfg.branches[r]=info.default_branch||'main';}
      LS.set('cfg',cfg); toast('تم الربط ✓'); await syncRemote(false); A.tab='home'; render();
    }catch(err){A.cfg=old; btn.disabled=false; btn.textContent='تحقّق واربط'; toast(explainError(err));}
    return;}
});
async function syncRemote(manual){ if(!connected()) return;
  try{const remote=await fetchRemote(); const hadChanges=changesCount()>0;
    A.remote=remote?normalize(remote):null; LS.set('remote',A.remote);
    if(!hadChanges||manual&&confirm('تحميل آخر نسخة منشورة من GitHub؟ (التغييرات غير المنشورة على هذا الجهاز ستُستبدل)')){A.draft=normalize(A.remote||defaults()); if(manual) A.pending={}; persist();}
    if(remote&&remote.updated){A.lastPublish=remote.updated; LS.set('lastPublish',A.lastPublish);}
    render(); if(manual) toast('تم التحديث من GitHub');
  }catch(err){ if(manual) toast(explainError(err)); }}

render();
syncRemote(false);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
